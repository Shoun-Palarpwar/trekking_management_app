{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-trek p-4 mt-4">
            <h3 class="mb-3 text-center"><i class="bi bi-person-plus"></i> Register</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">I am registering as a:</label>
                    <select name="role" class="form-select" required>
                        <option value="user">User (Trekker)</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                    <div class="form-text">Staff accounts require admin approval before dashboard access.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact" class="form-control">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm" class="form-control" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-trek w-100">Register</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
