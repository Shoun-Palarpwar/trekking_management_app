{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-trek p-4 mt-4">
            <h3 class="mb-3 text-center"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-trek w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
            </p>
            <hr>
            <p class="text-muted small text-center mb-0">
                Admin demo login &mdash; username: <code>admin</code> / password: <code>admin123</code>
            </p>
        </div>
    </div>
</div>
{% endblock %}
