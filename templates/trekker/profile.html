{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-trek p-4">
            <h3 class="mb-3"><i class="bi bi-person-circle"></i> My Profile</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" value="{{ user['username'] }}" disabled>
                    <div class="form-text">Username cannot be changed.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user['name'] }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user['email'] }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact" class="form-control" value="{{ user['contact'] }}">
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password (leave blank to keep current)</label>
                    <input type="password" name="new_password" class="form-control" minlength="6">
                </div>
                <button type="submit" class="btn btn-trek w-100">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
